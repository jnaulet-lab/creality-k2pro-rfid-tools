# automations.yaml - extrait : suivi du stock de filament (2 automations)
#  1) debit du stock a chaque changement de slot et en fin d'impression
#  2) alerte de stock bas (persistent_notification)
# A AJOUTER a votre automations.yaml (ou a recreer dans l'interface via 'Modifier en YAML').
# Adaptez 'k2pro_creality' au prefixe de vos entites.

- id: spoolmansync_update_spool_k2pro_creality
  alias: Stock filament - Debit consommation (k2pro_creality)
  description: >-
    A chaque changement de slot et en fin d'impression, retire la longueur
    consommee du stock de la reference de filament (script /config/stock).
    Le capteur used_material_length est cumulatif sur l'impression : on
    calcule un delta par rapport a une reference stockee dans un helper.
  triggers:
    - entity_id: sensor.spoolmansync_k2pro_creality_active_tray
      id: tray
      not_from: [unavailable, unknown]
      not_to: [unavailable, unknown]
      trigger: state
    - entity_id: sensor.k2pro_creality_print_status
      to: [completed, idle]
      id: print_end
      trigger: state
    - entity_id: sensor.k2pro_creality_print_status
      to: [printing]
      id: print_start
      trigger: state
    - entity_id: sensor.k2pro_creality_print_status
      to: ["off", offline]
      for: "00:02:00"
      id: offline
      trigger: state
  variables:
    last_length: "{{ states('input_number.k2pro_creality_last_used_length') | float(0) }}"
    current_length: "{{ states('sensor.k2pro_creality_used_material_length') | float(0) }}"
    delta_cm: "{{ ([current_length - last_length, 0] | max) | round(2) }}"
    old_tray: >-
      {% if trigger.id == 'tray' and trigger.from_state is not none
         and trigger.from_state.state not in [None, '', 'unknown', 'unavailable'] %}
        {{ trigger.from_state.state | int(-1) }}
      {% else %} -1 {% endif %}
    new_tray: >-
      {% if trigger.id == 'tray' and trigger.to_state is not none
         and trigger.to_state.state not in [None, '', 'unknown', 'unavailable'] %}
        {{ trigger.to_state.state | int(-1) }}
      {% else %} -1 {% endif %}
    helper_tray: "{{ states('input_number.spoolmansync_k2pro_creality_last_tray') | int(-1) }}"
    tray_composite: >-
      {% if trigger.id == 'print_end' or trigger.id == 'offline' %}
        {{ helper_tray }}
      {% else %}
        {{ old_tray if old_tray >= 0 else helper_tray }}
      {% endif %}
    tray_sensor: >-
      {% if tray_composite == 0 %}sensor.k2pro_creality_cfs_external_filament{% endif %}
      {% if tray_composite == 11 %}sensor.k2pro_creality_cfs_box_1_slot_1_filament{% endif %}
      {% if tray_composite == 12 %}sensor.k2pro_creality_cfs_box_1_slot_2_filament{% endif %}
      {% if tray_composite == 13 %}sensor.k2pro_creality_cfs_box_1_slot_3_filament{% endif %}
      {% if tray_composite == 14 %}sensor.k2pro_creality_cfs_box_1_slot_4_filament{% endif %}
    material_code: "{{ state_attr(tray_sensor, 'rfid') | default('') }}"
    material: "{{ state_attr(tray_sensor, 'type') | default('') }}"
    name: "{{ state_attr(tray_sensor, 'name') | default('') }}"
    color: "{{ state_attr(tray_sensor, 'color_hex') | default('') }}"
    vendor: "{{ state_attr(tray_sensor, 'vendor') | default('') }}"
    stock_color: "{{ color | string | replace('#', '') | lower }}"
    stock_key: >-
      {{ ((material_code | string if material_code | string | length > 0
           else material ~ '_' ~ name) ~ '_' ~ stock_color)
         | regex_replace('[^A-Za-z0-9_.-]', '') }}
    stock_label: >-
      {{ ([vendor, name or material] | select | join(' ') ~ ' #' ~ stock_color)
         | regex_replace('[^A-Za-z0-9 ._#()+-]', '') }}
  actions:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'print_start' }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.k2pro_creality_last_used_length
              data:
                value: 0
            - action: system_log.write
              data:
                message: "STOCK PRINT START (Creality) | Reference longueur remise a 0"
                level: info
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'tray' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ delta_cm >= 0.01 and tray_sensor != '' }}"
                  sequence:
                    - action: system_log.write
                      data:
                        message: >-
                          STOCK TRAY CHANGE (Creality) | Slot {{ tray_composite }} -> {{ new_tray }}
                          | Delta {{ delta_cm }}cm (total {{ current_length }}cm, ref {{ last_length }}cm)
                          | Filament: {{ name }} ({{ material }}) | Code: {{ material_code }}
                        level: info
                    - action: shell_command.stock_filament_debit
                      data:
                        key: "{{ stock_key }}"
                        label: "{{ stock_label }}"
                        material: "{{ material | regex_replace('[^A-Za-z0-9+-]', '') }}"
                        length_cm: "{{ delta_cm }}"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: sensor.stock_filament
              default:
                - action: system_log.write
                  data:
                    message: >-
                      STOCK TRAY CHANGE (Creality, skipped) | Slot {{ tray_composite }}
                      | Delta {{ delta_cm }}cm | Raison: pas de delta ou slot inconnu
                    level: info
            - action: input_number.set_value
              target:
                entity_id: input_number.k2pro_creality_last_used_length
              data:
                value: "{{ current_length }}"
            - condition: template
              value_template: "{{ new_tray >= 0 }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.spoolmansync_k2pro_creality_last_tray
              data:
                value: "{{ new_tray }}"
        - conditions:
            - condition: template
              value_template: >-
                {{ trigger.id == 'print_end'
                   and trigger.from_state is not none
                   and trigger.from_state.state not in ['unavailable', 'unknown', 'idle', 'completed', 'none'] }}
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ delta_cm >= 0.01 and tray_sensor != '' }}"
                  sequence:
                    - action: system_log.write
                      data:
                        message: >-
                          STOCK PRINT END (Creality) | Slot {{ tray_composite }}
                          | Delta {{ delta_cm }}cm (total {{ current_length }}cm, ref {{ last_length }}cm)
                          | Filament: {{ name }} ({{ material }}) | Code: {{ material_code }}
                        level: info
                    - action: shell_command.stock_filament_debit
                      data:
                        key: "{{ stock_key }}"
                        label: "{{ stock_label }}"
                        material: "{{ material | regex_replace('[^A-Za-z0-9+-]', '') }}"
                        length_cm: "{{ delta_cm }}"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: sensor.stock_filament
              default:
                - action: system_log.write
                  data:
                    message: >-
                      STOCK PRINT END (Creality, skipped) | Slot {{ tray_composite }}
                      | Delta {{ delta_cm }}cm | Raison: pas de delta ou slot inconnu
                    level: info
            - action: input_number.set_value
              target:
                entity_id: input_number.k2pro_creality_last_used_length
              data:
                value: 0
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'offline' }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ delta_cm >= 0.01 and tray_sensor != '' }}"
                  sequence:
                    - action: system_log.write
                      data:
                        message: >-
                          STOCK OFFLINE FLUSH (Creality) | Slot {{ tray_composite }}
                          | Delta {{ delta_cm }}cm
                        level: info
                    - action: shell_command.stock_filament_debit
                      data:
                        key: "{{ stock_key }}"
                        label: "{{ stock_label }}"
                        material: "{{ material | regex_replace('[^A-Za-z0-9+-]', '') }}"
                        length_cm: "{{ delta_cm }}"
                    - action: homeassistant.update_entity
                      target:
                        entity_id: sensor.stock_filament
              default:
                - action: system_log.write
                  data:
                    message: >-
                      STOCK OFFLINE FLUSH (Creality, skipped) | Slot {{ tray_composite }}
                      | Delta {{ delta_cm }}cm
                    level: info
            - action: input_number.set_value
              target:
                entity_id: input_number.k2pro_creality_last_used_length
              data:
                value: 0
  mode: single

- id: stock_filament_alerte_stock_bas
  alias: Stock filament - Alerte de stock bas
  description: >-
    Notifie une seule fois quand une reference passe sous le seuil
    (input_number.stock_filament_seuil_alerte) et efface l'alerte quand le stock remonte.
    Seuil a 0 = alertes desactivees. Seules les references dont le stock a ete saisi
    sont surveillees.
  mode: queued
  triggers:
    - trigger: state
      entity_id: sensor.stock_filament
  conditions:
    - condition: template
      value_template: >-
        {{ states('input_number.stock_filament_seuil_alerte') | float(0) > 0
           and trigger.from_state is not none and trigger.to_state is not none
           and trigger.from_state.state not in ['unknown', 'unavailable', '-1']
           and trigger.to_state.state not in ['unknown', 'unavailable', '-1'] }}
  variables:
    seuil: "{{ states('input_number.stock_filament_seuil_alerte') | float(0) }}"
    prev_low: >-
      {{ trigger.from_state.attributes.get('items', []) | selectattr('tracked')
         | selectattr('stock_g', 'lt', seuil) | map(attribute='key') | list }}
    now_low: >-
      {{ trigger.to_state.attributes.get('items', []) | selectattr('tracked')
         | selectattr('stock_g', 'lt', seuil) | list }}
    now_low_keys: "{{ now_low | map(attribute='key') | list }}"
    newly_low: "{{ now_low | rejectattr('key', 'in', prev_low) | list }}"
    recovered: "{{ prev_low | reject('in', now_low_keys) | list }}"
  actions:
    - repeat:
        for_each: "{{ newly_low }}"
        sequence:
          - action: persistent_notification.create
            data:
              notification_id: "stock_filament_bas_{{ repeat.item.key }}"
              title: Stock filament bas
              message: "{{ repeat.item.label }} : {{ repeat.item.stock_g | round(0) | int }} g restants (seuil : {{ seuil | round(0) | int }} g)"
    - repeat:
        for_each: "{{ recovered }}"
        sequence:
          - action: persistent_notification.dismiss
            continue_on_error: true
            data:
              notification_id: "stock_filament_bas_{{ repeat.item }}"
