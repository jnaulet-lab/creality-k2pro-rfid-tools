# Section de tableau de bord : stock de filament (tableau + carte 'Ajuster le stock')
# A coller dans la liste 'sections:' d'une vue de type 'Sections'
# (Tableau de bord > Modifier > menu a trois points > Editeur de configuration brut).
# Les boutons appellent les scripts de scripts_extrait.yaml :
# script.stock_filament_fixer_le_stock et script.stock_filament_ajouter_au_stock
# (adaptez ces identifiants si vos scripts en ont d'autres).
# La pastille de couleur est une image SVG integree : les styles CSS inline sont filtres
# par la carte Markdown.
type: grid
columns: 1
cards:
  - type: heading
    heading: Gestion du Stock de Filament
    heading_style: title
    icon: mdi:package-variant-closed
  - type: markdown
    title: Stock de bobines
    content: >
      {% set items = state_attr('sensor.stock_filament', 'items') or [] %}

      **Total suivi : {{ (state_attr('sensor.stock_filament', 'total_g') or 0) |
      round(0) | int }} g**


      | Couleur | Filament | Reste |

      |:---:|---|---:|

      {% for i in items -%}

      | {% if i.color %}<img src="data:image/svg+xml,%3Csvg
      xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24'
      cy='24' r='23' fill='%23{{ i.color }}'/%3E%3Ccircle cx='24' cy='24' r='23'
      fill='none' stroke='gray' stroke-opacity='.6'
      stroke-width='2'/%3E%3Ccircle cx='24' cy='24' r='8' fill='black'
      fill-opacity='.45'/%3E%3C/svg%3E" width="24" height="24" alt="{{ i.dot
      }}">{% else %}{{ i.dot }}{% endif %} | {{ i.name }} | {% if i.tracked %}{{
      i.stock_g | round(0) | int }} g{% else %}⚠️ stock à saisir ({{ i.stock_g |
      round(0) | int }} g){% endif %} |

      {% endfor %}
  - type: entities
    title: Ajuster le stock
    entities:
      - entity: input_select.stock_filament_choix
        name: Filament
      - entity: input_number.stock_filament_grammes
        name: Grammes
      - entity: script.stock_filament_fixer_le_stock
        name: Fixer le stock à cette valeur (pesée)
      - entity: script.stock_filament_ajouter_au_stock
        name: Ajouter cette quantité (achat)
column_span: 2

